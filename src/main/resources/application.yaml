spring:
  application:
    name: user-service
  config:
    import:
      - 'optional:dotenv:'
      - 'optional:configserver:'
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
  kafka:
    # producer 전용 (Outbox로 user-update-topic 발행). consumer 설정은 향후 hub.updated 등 구독 추가 시.
    bootstrap-servers: ${BOOTSTRAP_SERVERS}
    properties:
      security.protocol: SSL
      ssl.endpoint.identification.algorithm: ""
    ssl:
      trust-store-location: classpath:ssl/kafka.server.truststore.jks
      trust-store-password: ${TRUST_STORE_PASSWORD}
      trust-store-type: PKCS12
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 10000
        max.in.flight.requests.per.connection: 5
        retries: 3
        delivery.timeout.ms: 120000

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:18761/eureka}
    import: 'optional:configserver:'


keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:13300}
  realm: ${REALM:my-realm}
  username: ${KEYCLOAK_USERNAME:admin}
  password: ${KEYCLOAK_PASSWORD:admin}
  client-id: ${KEYCLOAK_CLIENT_ID:loopang-client}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}

topics:
  user:
    updated: ${TOPICS_USER_UPDATED:user-update-topic}